services:
  - type: web
    name: pdf-converter-api-gateway
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: master
    # Liveness only. `/health` calls auth, converter, and library.
    # Render polls about every 5s; that fan-out from one IP made Cloudflare
    # answer the converter with a 429 challenge. Operators still use `/health`.
    healthCheckPath: /
    buildFilter:
      paths:
        - services/api-gateway/**
        - shared/**
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: AUTH_SERVICE_URL
        value: https://pdf-converter-auth-service.onrender.com
      - key: CONVERTER_SERVICE_URL
        value: https://pdf-epub-converter-api.onrender.com
      - key: LIBRARY_SERVICE_URL
        value: https://pdf-converter-library-service.onrender.com
      - key: PORT
        value: "8080"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO" 